apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-db
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_USER
          value: splitter_user
        - name: POSTGRES_PASSWORD
          value: splitter_password
        - name: POSTGRES_DB
          value: expense_splitter
        ports:
        - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  ports:
  - port: 5432
  selector:
    app: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-cache
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  ports:
  - port: 6379
  selector:
    app: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: expense-splitter-deployment
  labels:
    app: expense-splitter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: expense-splitter
  template:
    metadata:
      labels:
        app: expense-splitter
    spec:
      imagePullSecrets:
      - name: dockerhub
      containers:
      - name: splitter-app
        image: Riya-k7/expense-splitter:qa
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: DATABASE_URL
          value: postgresql://splitter_user:splitter_password@db:5432/expense_splitter
        - name: REDIS_URL
          value: redis://redis:6379/0
---
apiVersion: v1
kind: Service
metadata:
  name: expense-splitter-service
spec:
  type: NodePort
  selector:
    app: expense-splitter
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
