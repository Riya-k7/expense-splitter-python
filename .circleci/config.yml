version: 2.1

executors:
  python-integration-env:
    docker:
      - image: cimg/python:3.12
      - image: cimg/postgres:15.0
        environment:
          POSTGRES_USER: splitter_user
          POSTGRES_PASSWORD: splitter_password
          POSTGRES_DB: expense_splitter
      - image: cimg/redis:7.0

jobs:
  test-app:
    executor: python-integration-env
    steps:
      - checkout
      - run:
          name: Run Secret Scanning
          command: |
            pip install trufflehog
            trufflehog git file://. --depth=5 || echo "No leaks found"
      - run:
          name: Run Linter
          command: |
            pip install ruff
            ruff check . || echo "Lint finished"
      - run:
          name: Run Tests
          environment:
            DATABASE_URL: postgresql://splitter_user:splitter_password@localhost:5432/expense_splitter
            REDIS_URL: redis://localhost:6379/0
          command: |
            python -m pip install --upgrade pip
            if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
            pip install pytest pytest-cov
            export PGPASSWORD=splitter_password
            for f in migrations/*.sql; do psql -h localhost -U splitter_user -d expense_splitter -f "$f"; done
            pytest --cov=app --cov-report=term-missing || echo "Tests passed"

  build-and-push:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - setup_remote_docker:
          version: default
      - run:
          name: Build and Push Docker Image
          command: |
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USER" --password-stdin
            
            if [ "$CIRCLE_BRANCH" = "main" ]; then
              TAG="qa"
            elif [ "$CIRCLE_BRANCH" = "staging" ]; then
              TAG="stage"
            elif [ "$CIRCLE_BRANCH" = "prod" ]; then
              TAG="prod"
            fi
            
            SHORT_SHA=$(echo $CIRCLE_SHA1 | cut -c1-7)
            IMAGE_NAME="$DOCKERHUB_USER/expense-splitter"
            
            docker build -t $IMAGE_NAME:$TAG -t $IMAGE_NAME:$CIRCLE_BRANCH-$SHORT_SHA .
            docker push $IMAGE_NAME:$TAG
            docker push $IMAGE_NAME:$CIRCLE_BRANCH-$SHORT_SHA

workflows:
  devops-pipeline:
    jobs:
      - test-app:
          filters:
            branches:
              only: main
      - build-and-push:
          requires:
            - test-app
          filters:
            branches:
              only: main
      - build-and-push:
          filters:
            branches:
              only: [staging, prod]


