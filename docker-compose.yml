services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: splitter_user
      POSTGRES_PASSWORD: splitter_password
      POSTGRES_DB: expense_splitter
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitter_user -d expense_splitter"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  migrations:
    image: postgres:15-alpine
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    environment:
      PGPASSWORD: splitter_password
    entrypoint: >
      sh -c "for f in /migrations/*.sql; do psql -h db -U splitter_user -d expense_splitter -f \"$$f\"; done"

  splitter-app:
    build: .
    image: expense-splitter:local
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql://splitter_user:splitter_password@db:5432/expense_splitter
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully


